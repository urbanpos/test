<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Gmail Refine with ChatGPT — Settings</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; padding: 18px; width: 420px; color: #202124; }
    h1 { font-size: 16px; margin: 0 0 12px; }
    label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
    textarea { width: 100%; height: 180px; box-sizing: border-box; padding: 8px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; border: 1px solid #ccc; border-radius: 6px; }
    .row { display: flex; gap: 8px; margin-top: 10px; }
    button { padding: 6px 14px; border-radius: 18px; border: 1px solid #1a73e8; background: #1a73e8; color: white; cursor: pointer; font-size: 13px; }
    button.secondary { background: white; color: #1a73e8; }
    .hint { font-size: 12px; color: #5f6368; margin-top: 6px; }
    .status { font-size: 12px; color: #137333; margin-top: 8px; min-height: 16px; }
  </style>
</head>
<body>
  <h1>Refine prompt</h1>
  <label for="prompt">Sent to ChatGPT before your draft:</label>
  <textarea id="prompt"></textarea>
  <div class="hint">Your draft is appended verbatim after this text. ChatGPT's reply replaces the draft.</div>
  <div class="row">
    <button id="save">Save</button>
    <button id="reset" class="secondary">Reset to default</button>
  </div>
  <div class="status" id="status"></div>
  <script src="options.js"></script>
</body>
</html>
